[package]
name = "plotweave"
version = "0.1.0"
description = "PlotWeave —— 面向短剧创作的可视化画布工具"
edition = "2021"

[lib]
# Tauri 移动端需要 staticlib/cdylib；rlib 供集成测试链接。
name = "plotweave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
