sonar.projectKey=PlotWeave
sonar.projectName=PlotWeave
sonar.sourceEncoding=UTF-8

sonar.sources=src,src-tauri/src
sonar.tests=src
# 测试设施分类（issue #311）：*.test.ts(x) 之外，仅服务测试的模块——
# 架构守卫 moduleGraph（issue #106 回归守卫，无应用侧导入者）、样式契约
# 引擎四件（styles 四文件仅被样式契约测试链引用；issue #343 补录拆分件
# sheetRuleQuery）、convert/testGraphs 共享测试夹具——与编译期类型探针
# *.test-d.ts（issue #231，纯类型无运行时形态）同样按「源码排除 + 测试
# 纳入」组合归类：移出生产源码统计，仍被 Sonar 分析为测试代码，不使用
# 宽泛排除隐藏质量。分类清单由 scripts/sonar-test-scope.test.ts 固定，
# 并以导入者侧守卫防拆分支持模块后再遗漏（issue #343）。
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.test-d.ts,src/moduleGraph.ts,src/model/convertFixtures.ts,src/editor/ai/testGraphs.ts,src/styles/cssColorContract.ts,src/styles/cssValueSyntax.ts,src/styles/sheetRuleQuery.ts,src/styles/sheetTokensEngine.ts
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/**/*.test-d.ts,src/moduleGraph.ts,src/model/convertFixtures.ts,src/editor/ai/testGraphs.ts,src/styles/cssColorContract.ts,src/styles/cssValueSyntax.ts,src/styles/sheetRuleQuery.ts,src/styles/sheetTokensEngine.ts

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Rust 语句（行）覆盖率（issue #169）：由 scripts/rust-coverage.sh 生成
#（cargo-llvm-cov --lib --lcov，稳定版工具链无分支口径，见
# docs/development/rust-standard.md「测试覆盖率」）；门禁扫描前刷新。
sonar.rust.cargo.manifestPaths=src-tauri/Cargo.toml
sonar.rust.lcov.reportPaths=src-tauri/target/coverage/lcov-rust.info

# --- 人工复核后的规则豁免（2026-08-28）---
# css:S7924 无法合成「半透明色叠渐变底」的真实对比度：nodes.css 全部 8 处
# 命中已逐条人工复核——6 处为误报（如 #1d1d1f 文字叠暖白横格纸面，
# 实际对比度 >9:1），2 处为有意设计（⚙️ 设置钮静止态降对比，hover 显现）。
# 该规则无法逐行关闭，故按文件豁免；nodes.css 新增配色仍需人工把关对比度。
sonar.issue.ignore.multicriteria=1
sonar.issue.ignore.multicriteria.1.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.1.resourceKey=src/editor/nodes/nodes.css