# 仓库级 Rust 工具链固定入口（issue #167）：与 .nvmrc 对 Node 的作用对齐。
# rustup 在仓库任意目录下代理解析到本文件——干净机器自动安装并获得一致的
# rustc/rustfmt/clippy，路由检查（AGENTS.md src-tauri/** 行）因此可复现。
# 升级政策见 docs/development/rust-standard.md：单独改动本文件并附路由
# 命令的验证记录；不得在此添加未经项目决定的平台 targets。
[toolchain]
channel = "1.95.0"
# llvm-tools（llvm-profdata/llvm-cov）供 cargo-llvm-cov 生成覆盖率报告
#（issue #169）；干净机器随工具链自动安装。
components = ["rustfmt", "clippy", "llvm-tools"]
