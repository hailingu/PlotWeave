[package]
name = "plotweave-core"
version = "0.3.0"
edition = "2021"
description = "PlotWeave 宿主无关的项目存储内核（数据模型 v1 §10/§11）"

[dependencies]
cap-std = "4.0.3"
# 从既有 Tauri 存储内核随耐久备份迁入的摘要依赖。
sha2 = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
log = "0.4"

[features]
# 仅宿主测试依赖启用：共享真实存储原语的线程隔离故障注入。
test-support = []
