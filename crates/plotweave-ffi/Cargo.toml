[package]
name = "plotweave-ffi"
version = "0.3.0"
edition = "2021"
description = "PlotWeave 历史 C ABI 与合同回归边界（当前 Swift 原生应用不链接）"

[lib]
name = "plotweave_ffi"
crate-type = ["rlib", "staticlib"]

[dependencies]
plotweave-core = { path = "../plotweave-core" }
cap-std = "4.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
serde_json = "1.0.151"
