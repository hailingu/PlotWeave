# 依赖与供应链浮现机制（issue #552 方案 1）：Dependabot 按 ecosystem 周粒度
# 开 PR——只开 PR、从不自动合并，合并仍走既有分支保护与 ci.yml 必需检查。
# 目标分支固定 dev：依赖更新属于普通任务变更（AGENTS.md 分支策略：任务 PR
# 面向 dev），不直接面向 main。已知边界（PR #582 评审）：target-branch 仅
# 约束本文件的版本更新；安全更新（security updates）是仓库设置层的独立功能
# （当前未启用），其 PR 按平台行为恒定指向默认分支 main、不可配置——处置
# 口径见 workflow.md「Dependency And Supply-Chain Visibility」。npm 只覆盖
# 根 package.json；cargo 以一个多目录条目覆盖双 Cargo workspace
#（src-tauri 与 crates），共享同一 minor/patch 更新组（issue #732）；github-actions 覆盖
# .github/workflows（native 应用无第三方 Swift 包依赖，不在覆盖面内）。
# npm 的 React、Vite、Vitest 配套包先按家族成组（所有更新级别，issue #761），
# 避免 runtime/类型或精确 peer 版本被拆开；其余 minor/patch 按 ecosystem 降噪。
# 其他 major 仍单独评审，分组不保证未来代际兼容，安装/测试门禁继续阻断。
# 工具链钉版（.nvmrc / rust-toolchain.toml）不属于这些 ecosystem，不受影响。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      react-family:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      vite-family:
        patterns:
          - vite
          - '@vitejs/plugin-react'
      vitest-family:
        patterns:
          - vitest
          - '@vitest/coverage-v8'
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /crates
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
