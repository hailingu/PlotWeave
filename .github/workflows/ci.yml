# PR 检查（issue #228）：面向 dev 的持续集成——版本化路由检查
#（AGENTS.md Scope Routing）在 GitHub 上有独立、绑定提交 SHA 的记录，
# 不再只依赖调用者本机环境。工具版本复用 .nvmrc / rust-toolchain.toml。
# SonarQube 扫描保留在本机门禁（scripts/sonar-quality-gate.sh）——Sonar
# 服务在本机，GitHub 托管 runner 不可达；CI 不重复扫描也不削弱本地
# 门禁（覆盖率与 Sonar 证据由本地门禁日志保留）。
name: ci
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Scope Routing「src/** 与根前端清单」+「.githooks/scripts/sonar 配置」行
  frontend:
    name: frontend（src/** 与 scripts 行）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: format:check（src 行）
        run: npm run format:check
      - name: lint 零警告（src 行；与本地门禁同口径）
        run: npm run lint -- --max-warnings=0
      - name: 严格索引类型检查（src 行，issues #230/#231；与本地门禁同口径）
        run: npm run typecheck:strict
      - name: build（src 行）
        run: npm run build
      - name: test（src 行）
        run: npm test
      - name: scripts/.githooks 行
        run: npm test -- scripts

  # Scope Routing「src-tauri/**」行（工作目录 src-tauri）
  rust:
    name: rust（src-tauri/**）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # rustup 按 rust-toolchain.toml 自动解析并安装钉版工具链（1.95.0 +
      # rustfmt/clippy/llvm-tools 组件）——单一事实源在 rust-toolchain.toml，
      # 不在此重复（macos-15 runner 预装 rustup）
      - name: 安装钉版 Rust 工具链（rust-toolchain.toml）
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test
