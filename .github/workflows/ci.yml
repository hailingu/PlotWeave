# PR 检查（issue #228）：面向 dev / main 的持续集成——版本化路由检查
#（AGENTS.md Scope Routing）在 GitHub 上有独立、绑定提交 SHA 的记录，
# 不再只依赖调用者本机环境。工具版本复用 .nvmrc / rust-toolchain.toml。
# SonarQube 扫描保留在本机门禁（scripts/sonar-quality-gate.sh）——Sonar
# 服务在本机，GitHub 托管 runner 不可达；CI 不重复扫描也不削弱本地
# 门禁（覆盖率与 Sonar 证据由本地门禁日志保留）。
name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Scope Routing「src/** 与根前端清单」+「.githooks/scripts/sonar 配置」行
  frontend:
    name: frontend（src/** 与 scripts 行）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Bootstrap regression fixtures import the approved immutable history locally.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # #618：high/critical 漏洞或审计执行失败均阻断；保留全量锁文件口径。
      - name: npm audit --audit-level=high（issue #618；阻断）
        run: npm audit --audit-level=high
      - run: npm ci
      - name: format:check（src 行）
        run: npm run format:check
      - name: lint 零警告（src 行；与本地门禁同口径）
        run: npm run lint -- --max-warnings=0
      - name: 严格索引类型检查（src 行，issues #230/#231；与本地门禁同口径）
        run: npm run typecheck:strict
      - name: 维护源码文件规模（issue #432；含 Rust 与 scripts）
        run: npm run check:size
      - name: build（src 行）
        run: npm run build
      # test 同时覆盖 Scope Routing 的 src 行与 .githooks/scripts/sonar
      # 行的测试部分：默认 vitest 发现已含 scripts/**/*.test.ts（issue
      # #617 核实：238 个测试文件中 18 个为 scripts，.githooks 无独立
      # 测试文件）；原独立的 `npm test -- scripts` 步骤是同批用例的重复
      # 执行，已删除——scripts 用例失败同样使本步骤非零退出阻断 PR。
      - name: test（src 行 + scripts/.githooks 行；issue #617）
        run: npm test

  # Scope Routing「src-tauri/**」行（工作目录 src-tauri）
  rust:
    name: rust（src-tauri/**）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 元守卫使用 Node 校验版本化 JSON 基线，复用仓库钉版工具链；
      # npm 缓存服务于 issue #551 链路用例输入的 npm ci。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # rustup 按 rust-toolchain.toml 自动解析并安装钉版工具链（1.95.0 +
      # rustfmt/clippy/llvm-tools 组件）——单一事实源在 rust-toolchain.toml，
      # 不在此重复（macos-15 runner 预装 rustup）
      - name: 安装钉版 Rust 工具链（rust-toolchain.toml）
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri
            crates
      # 依赖审计（issue #552 方案 2）：cargo-audit 用预编译二进制安装
      # （taiki-e/install-action），只读两个 workspace 的 Cargo.lock，
      # 不参与编译。漏洞级 advisory 使步骤失败（阻断合入）；
      # unmaintained / unsound / yanked 等 informational warning 不失败
      # ——现有 informational 的明细与处置记录见
      # docs/development/workflow.md。#618 固定扫描器版本；advisory DB 仍
      # 在运行时刷新，工具升级经独立评审。
      - name: 安装 cargo-audit（issue #552）
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit src-tauri/Cargo.lock（issue #552）
        run: cargo audit --color never --file src-tauri/Cargo.lock
      - name: cargo audit crates/Cargo.lock（issue #552）
        run: cargo audit --color never --file crates/Cargo.lock
      # Tauri 使用的 Rust 内核与历史 P2 C ABI 保留 workspace 路由检查；
      # Swift 原生应用使用独立 Swift 服务，不链接 Rust 或该 C ABI。
      # 双 workspace 漂移护栏（issue #549）：plotweave-core 闭包共享包
      # 版本集在两侧一致；--locked 保证检查不改写锁文件（与本地路由检查
      # 同口径，见 AGENTS.md Scope Routing 的 Rust 行）。
      - name: 双 workspace 共享依赖版本一致性（issue #549）
        run: npm run check:workspace-drift
      - name: crates cargo fmt --check
        working-directory: crates
        run: cargo fmt --check
      - name: crates cargo clippy --all-targets -- -D warnings
        working-directory: crates
        run: cargo clippy --all-targets -- -D warnings
      - name: crates cargo test
        working-directory: crates
        run: cargo test
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      # 前端 bundle 全链路回归（issue #551）：src-tauri cargo test 中的
      # frontend_bundle_chain 用例经真实 Wry 加载 dist 真实构建产物驱动
      # IPC→落盘链路；dist 缺失即自跳过——先构建保证该用例在 CI 必跑
      # （本地未构建时跳过不阻断路由检查命令）。
      - name: npm ci（issue #551 链路用例输入）
        run: npm ci
      - name: npm run build（issue #551 链路用例输入）
        run: npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # SwiftUI 固定 Xcode 27.0 / macOS SDK 27.0；最低部署版本仍为 macOS 26.0。
  native:
    name: native（native/**）
    runs-on: xcode-27
    env:
      # 使用镜像公开的版本别名，避免默认 Xcode 更新后静默切换工具链。
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 验证钉版 Xcode 与 macOS SDK
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "27.0"
      - name: Swift 与 WKWebView 回归
        # App-hosted 的窗口、焦点及退出委托共享一个 NSApplication；各套件不能并发改写它。
        # 默认保留功能回归，持续性能及长循环测量由 test-native.sh stress 按需运行。
        run: sh scripts/test-native.sh
      - name: Upload native Swift coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-coverage-${{ github.run_attempt }}
          path: |
            native/macos/build/coverage/coverage-summary.json
            native/macos/build/coverage/coverage-summary.md
            native/macos/build/coverage/xccov.json
          # Collection itself fails closed; failed builds may not have produced reports.
          if-no-files-found: ignore

  # 门禁证据核验（issue #548 方案 1）：本地门禁（Sonar + 覆盖率）在托管
  # runner 上不可达，改为服务端复核其版本化自述证据 docs/development/
  # gate-history.jsonl（issue #355）：PR 范围内除 tip 外的每个提交必须在
  # head 版台账中存在 tree 匹配且 Quality Gate OK、新增代码未解决问题为 0
  # 的通过记录；tip 自身的门禁记录（提交与推送两轮）按物化时序滞后
  # 一次提交，仅注解告警或按「仅改台账的 tip」豁免；dev → main 发布
  # 范围额外识别集成边界：合并提交跳过、被集成分支 tip（合并的非首父）
  # 同告警、台账入库前的历史提交豁免（PR #581 评审 5542207474）。
  # 与分支保护（issue #548 方案 2）互补：
  # 本校验复核自述台账的留证约束（不证明真实执行），分支保护关闭直推。只读台账、不新增
  # 本地门禁变体（quality-gate-cost.md 的单一成本决策不变）。语义与容差
  # 见 docs/development/quality-gate-evidence.md。仅 PR 事件运行：push 到
  # dev/main 的运行包含服务端创建的合并提交，本无本地台账记录。
  gate-evidence:
    name: gate-evidence（门禁证据核验）
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # #593：执行代码及 .nvmrc 取自事件 base 的不可变提交；PR 只提供 Git 对象。
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: 校验 PR 提交的门禁证据（issue #548）
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 集成边界豁免仅本仓库自身的 dev → main 发布 PR 启用：base 为
          # main、head 为 dev、且 head 仓库即本仓库——fork 中同名 dev 分
          # 支不获豁免（PR #581 评审 5542342537/5542467935/5542611194：分
          # 支保护不限制 PR 来源，短分支名可被 fork 复刻）；其余一律留证
          RELEASE_BOUNDARY: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'dev' && github.event.pull_request.head.repo.full_name == github.repository && '1' || '' }}
        run: |
          # 只获取对象，不检出、安装依赖或执行 head 的任何内容；失败不回退到 PR 核验器。
          git fetch --no-tags origin "$HEAD_SHA"
          # Owner-approved bootstrap, 2026-10-22; exact old main and release shape only.
          # The exact old main lacks the verifier; never execute PR-head code.
          if [ "$BASE_SHA" = "fbd298ebe6cfa1a9fab6e632c00cdede06d81faf" ] &&
             [ "$RELEASE_BOUNDARY" = "1" ]; then
            verifier_path="$RUNNER_TEMP/plotweave-bootstrap-verifier.ts"
            GIT_NO_REPLACE_OBJECTS=1 git show 4e17c1c198aa8150c87473849d61e92692083777:scripts/verify-gate-evidence.ts > "$verifier_path"
            node "$verifier_path" --base "$BASE_SHA" --head "$HEAD_SHA" --release-boundary
          else
            node scripts/verify-gate-evidence.ts --base "$BASE_SHA" --head "$HEAD_SHA" ${RELEASE_BOUNDARY:+--release-boundary}
          fi
