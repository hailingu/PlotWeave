# PR 检查（issue #228）：面向 dev / main 的持续集成——版本化路由检查
#（AGENTS.md Scope Routing）在 GitHub 上有独立、绑定提交 SHA 的记录，
# 不再只依赖调用者本机环境。工具版本复用 .nvmrc / rust-toolchain.toml。
# SonarQube 扫描保留在本机门禁（scripts/sonar-quality-gate.sh）——Sonar
# 服务在本机，GitHub 托管 runner 不可达；CI 不重复扫描也不削弱本地
# 门禁（覆盖率与 Sonar 证据由本地门禁日志保留）。
name: ci
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Scope Routing「src/** 与根前端清单」+「.githooks/scripts/sonar 配置」行
  frontend:
    name: frontend（src/** 与 scripts 行）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: format:check（src 行）
        run: npm run format:check
      - name: lint 零警告（src 行；与本地门禁同口径）
        run: npm run lint -- --max-warnings=0
      - name: 严格索引类型检查（src 行，issues #230/#231；与本地门禁同口径）
        run: npm run typecheck:strict
      - name: 维护源码文件规模（issue #432；含 Rust 与 scripts）
        run: npm run check:size
      - name: build（src 行）
        run: npm run build
      - name: test（src 行）
        run: npm test
      - name: scripts/.githooks 行
        run: npm test -- scripts

  # Scope Routing「src-tauri/**」行（工作目录 src-tauri）
  rust:
    name: rust（src-tauri/**）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # 元守卫使用 Node 校验版本化 JSON 基线，复用仓库钉版工具链。
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # rustup 按 rust-toolchain.toml 自动解析并安装钉版工具链（1.95.0 +
      # rustfmt/clippy/llvm-tools 组件）——单一事实源在 rust-toolchain.toml，
      # 不在此重复（macos-15 runner 预装 rustup）
      - name: 安装钉版 Rust 工具链（rust-toolchain.toml）
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates
      # Tauri 使用的 Rust 内核与历史 P2 C ABI 保留 workspace 路由检查；
      # Swift 原生应用使用独立 Swift 服务，不链接 Rust 或该 C ABI。
      # 双 workspace 漂移护栏（issue #549）：plotweave-core 闭包共享包
      # 版本集在两侧一致；--locked 保证检查不改写锁文件（与本地路由检查
      # 同口径，见 AGENTS.md Scope Routing 的 Rust 行）。
      - name: 双 workspace 共享依赖版本一致性（issue #549）
        run: npm run check:workspace-drift
      - name: crates cargo fmt --check
        working-directory: crates
        run: cargo fmt --check
      - name: crates cargo clippy --all-targets -- -D warnings
        working-directory: crates
        run: cargo clippy --all-targets -- -D warnings
      - name: crates cargo test
        working-directory: crates
        run: cargo test
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # SwiftUI 固定 Xcode 27.0 / macOS SDK 27.0；最低部署版本仍为 macOS 26.0。
  native:
    name: native（native/**）
    runs-on: xcode-27
    env:
      # 使用镜像公开的版本别名，避免默认 Xcode 更新后静默切换工具链。
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 验证钉版 Xcode 与 macOS SDK
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 27.0"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "27.0"
      - name: build:native-canvas
        run: npm run build:native-canvas
      - name: Swift 与 WKWebView 回归
        # App-hosted 的窗口、焦点及退出委托共享一个 NSApplication；各套件不能并发改写它。
        run: xcodebuild -project native/macos/PlotWeaveNative.xcodeproj -scheme PlotWeaveNative -destination 'platform=macOS' -derivedDataPath native/macos/build/DerivedData -parallel-testing-enabled NO test
